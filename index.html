<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Hochwurf</title>
<meta name="theme-color" content="#7ec8e3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hochwurf">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<!--GAME-START-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Samstagscomic: dicke Tusche-Konturen, flache Farben, Panels wie Aufkleber. Ein Look für Tag und Nacht. */
:root{
  --ink:#1e1a2e; --paper:#fff4e0; --paper2:#f5e3c3; --red:#e8463a; --yellow:#ffd23a; --blue:#2f6fd6; --green:#5cae4a; --sky:#7ec8e3; --mut:#7a6f66;
  --disp:"Luckiest Guy","Arial Black",Impact,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{height:100%;margin:0;background:var(--sky);color:var(--ink);font-family:var(--body);overflow:hidden;overscroll-behavior:none}
#c{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
.layer{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:5;
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(16px,env(safe-area-inset-left,0px))}
.layer.dim{background:rgba(30,26,46,.45)}
.layer.page{justify-content:flex-start}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.btn{font-family:var(--disp);font-size:28px;letter-spacing:.03em;padding:14px 40px 9px;border-radius:16px;color:var(--ink);background:var(--yellow);
  border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn.red{background:var(--red);color:var(--paper)}
.btn.small{font-size:19px;padding:10px 20px 6px;box-shadow:0 4px 0 var(--ink)}
.btn.small:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.chip{font-weight:900;font-size:13px;padding:8px 12px;border-radius:10px;background:var(--paper);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.chip.off{opacity:.55;text-decoration:line-through}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.title{font-family:var(--disp);font-weight:400;font-size:clamp(52px,16vw,76px);line-height:.85;margin:0;color:var(--yellow);letter-spacing:.02em;
  text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 9px 0 var(--ink);
  transform:rotate(-5deg);text-align:center}
.title small{display:block;font-size:.34em;color:var(--paper);letter-spacing:.06em;margin-top:8px;text-shadow:2px 0 0 var(--ink),-2px 0 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink),0 4px 0 var(--ink)}
.h2{font-family:var(--disp);font-weight:400;font-size:38px;margin:0;color:var(--paper);line-height:1;
  text-shadow:2px 0 0 var(--ink),-2px 0 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink),0 5px 0 var(--ink)}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:4px 5px 0 var(--ink);padding:12px 14px;width:min(380px,100%)}
.card h3{margin:0 0 6px;font-family:var(--disp);font-weight:400;font-size:17px;letter-spacing:.04em}
.coin{display:inline-flex;align-items:center;gap:5px;font-weight:900;font-variant-numeric:tabular-nums}
.coin::before{content:"";width:.95em;height:.95em;border-radius:50%;background:var(--yellow);border:2.5px solid var(--ink);box-sizing:border-box;flex:none}
.pill{background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:5px 11px;font-size:16px;box-shadow:0 3px 0 var(--ink)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:min(380px,100%)}
.tab{font-family:var(--disp);font-size:18px;padding:12px 4px 7px;border-radius:14px;background:var(--paper);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
.tab:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.scroll{width:min(420px,100%);overflow-y:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:11px;padding:4px 8px 10px 4px;-webkit-overflow-scrolling:touch}
.list-head{display:flex;justify-content:space-between;align-items:center;width:min(420px,100%);gap:10px}
.stats-row{display:flex;gap:10px;justify-content:center}
.stat{background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:5px 12px 3px;text-align:center;box-shadow:0 3px 0 var(--ink)}
.stat b{display:block;font-family:var(--disp);font-weight:400;font-size:22px;line-height:1.1}
.stat b.coin{display:flex;justify-content:center}
.buy .coin::before{background:var(--paper)}
.stat span{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.mis{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:7px 0;border-top:2px dashed #d9c6a3}
.mis:first-of-type{border-top:0}
.mis .t{font-weight:800;font-size:15px;line-height:1.2}
.mis .r{font-weight:900;font-size:13px;white-space:nowrap}
.bar{grid-column:1/-1;height:10px;border-radius:6px;background:#e9d7b6;border:2px solid var(--ink);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
.mis.done .t{color:var(--green)}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center}
.item.sel{background:#fff9c9}
.ico{width:46px;height:46px;border-radius:12px;border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--disp);font-size:22px;background:var(--sky)}
.item .n{font-weight:900;font-size:16px}
.item .d{font-size:13px;color:var(--mut);font-weight:700;line-height:1.3}
.pips{display:flex;gap:3px;margin-top:5px}
.pips i{width:12px;height:7px;border-radius:3px;background:#e9d7b6;border:1.5px solid var(--ink)}
.pips i.on{background:var(--yellow)}
.buy{font-weight:900;font-size:14px;padding:8px 10px;border-radius:10px;background:var(--yellow);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.buy:disabled{background:#e9d7b6;color:var(--mut);box-shadow:none}
.tagx{font-weight:900;font-size:12px;padding:5px 9px;border-radius:8px;border:2.5px solid var(--ink);background:var(--green);color:var(--paper);white-space:nowrap}
.tagx.grey{background:#e9d7b6;color:var(--mut)}
#hud{position:fixed;left:0;right:0;top:0;z-index:4;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));
  display:grid;grid-template-columns:auto 1fr auto;align-items:start;gap:8px}
#hud button{pointer-events:auto}
#hScore{font-family:var(--disp);font-size:40px;text-align:center;color:var(--paper);line-height:1;font-variant-numeric:tabular-nums;
  text-shadow:2px 0 0 var(--ink),-2px 0 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink),0 5px 0 var(--ink)}
.stam{width:120px;height:12px;margin:5px auto 0;background:var(--paper);border:3px solid var(--ink);border-radius:8px;overflow:hidden}
.stam i{display:block;height:100%;width:100%;background:var(--green);transition:width .3s,background .3s}
#hCombo{font-family:var(--disp);font-size:18px;text-align:center;color:var(--yellow);margin-top:2px;
  text-shadow:2px 0 0 var(--ink),-2px 0 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink)}
.hright{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 110px);transform:translate(-50%,-20px);opacity:0;z-index:30;pointer-events:none;
  background:var(--paper);border:3px solid var(--ink);border-radius:12px;box-shadow:0 4px 0 var(--ink);padding:8px 14px;font-weight:900;font-size:15px;
  transition:all .3s cubic-bezier(.2,1.6,.4,1);width:max-content;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
body:not(.playing) #toast{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,20px)}
body:not(.playing) #toast.on{transform:translate(-50%,0)}
.rec{font-family:var(--disp);font-size:22px;color:var(--paper);background:var(--red);border:3px solid var(--ink);border-radius:10px;padding:6px 14px 2px;transform:rotate(-6deg);box-shadow:0 4px 0 var(--ink)}
.big-num{font-family:var(--disp);font-size:66px;line-height:.9;color:var(--yellow);
  text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),2px 2px 0 var(--ink),-2px -2px 0 var(--ink),0 8px 0 var(--ink)}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){.btn,.tab,.chip,.buy{transition:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hide">
  <button class="chip" id="pauseBtn" aria-label="Pause">II</button>
  <div><div id="hScore">0</div><div class="stam"><i id="hStam"></i></div><div id="hCombo"></div></div>
  <div class="hright"><span class="pill coin" id="hCoins">0</span></div>
</div>
<div id="toast"></div>

<div class="layer" id="menu">
  <div style="flex:.6"></div>
  <h1 class="title">HOCHWURF<small>Fangen · Werfen · Höher</small></h1>
  <div style="height:8px"></div>
  <div class="stats-row">
    <div class="stat"><b id="mBestH">0 m</b><span>Höhe</span></div>
    <div class="stat"><b id="mBestS">0</b><span>Punkte</span></div>
    <div class="stat"><b class="coin" id="mCoins">0</b><span>Münzen</span></div>
  </div>
  <button class="btn" id="playBtn">LOS GEHT'S</button>
  <div class="tabs">
    <button class="tab" data-go="shop">Schuppen</button>
    <button class="tab" data-go="chars">Springer</button>
    <button class="tab" data-go="places">Orte</button>
  </div>
  <div class="card" id="mMis"></div>
  <div class="row"><button class="chip" id="sndBtn">Ton</button><button class="chip" id="vibBtn">Vibration</button></div>
  <div style="flex:1"></div>
</div>

<div class="layer dim page hide" id="shop">
  <div class="list-head"><h2 class="h2">SCHUPPEN</h2><span class="pill coin" id="shCoins">0</span></div>
  <div class="scroll" id="shopList"></div>
  <button class="btn small" data-back>Zurück</button>
</div>
<div class="layer dim page hide" id="chars">
  <div class="list-head"><h2 class="h2">SPRINGER</h2><span class="pill coin" id="chCoins">0</span></div>
  <div class="scroll" id="charList"></div>
  <button class="btn small" data-back>Zurück</button>
</div>
<div class="layer dim page hide" id="places">
  <div class="list-head"><h2 class="h2">ORTE</h2><span class="pill coin" id="plCoins">0</span></div>
  <div class="scroll" id="placeList"></div>
  <button class="btn small" data-back>Zurück</button>
</div>

<div class="layer dim hide" id="pause">
  <h2 class="h2">PAUSE</h2>
  <button class="btn" id="resumeBtn">WEITER</button>
  <button class="btn small red" id="quitBtn">Aufgeben</button>
</div>

<div class="layer dim hide" id="over">
  <div class="rec hide" id="oRec">NEUER REKORD!</div>
  <div class="big-num" id="oScore">0</div>
  <div class="h2" style="font-size:20px">PUNKTE</div>
  <div class="stats-row">
    <div class="stat"><b id="oH">0 m</b><span>Höhe</span></div>
    <div class="stat"><b id="oFlips">0</b><span>Saltos</span></div>
    <div class="stat"><b class="coin" id="oCoins">0</b><span>Münzen</span></div>
  </div>
  <div class="card" id="oMis"></div>
  <div class="row"><button class="btn small" id="oMenu" style="background:var(--paper)">Menü</button><button class="btn" id="oAgain">NOCHMAL</button></div>
</div>

<script>
'use strict';
(function(){
const $=s=>document.querySelector(s);
const cv=$('#c'),ctx=cv.getContext('2d');
const TAU=Math.PI*2,rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,ri=(a,b)=>Math.floor(rnd(a,b+1));
const K={ink:'#1e1a2e',paper:'#fff4e0',red:'#e8463a',yellow:'#ffd23a',blue:'#2f6fd6',green:'#5cae4a',orange:'#f28c28',teal:'#2bb3a3',pink:'#f06aa4',grey:'#9aa5b1'};
const DISP='"Luckiest Guy","Arial Black",Impact,sans-serif',BODY='"Nunito",system-ui,sans-serif';
const fmt=n=>Math.floor(n).toLocaleString('de-DE');
const W=400,TY=-70; // Weltbreite, Höhe des Sprungtuchs (y nach oben negativ)
const toM=y=>Math.max(0,(TY-y)/10);

/* ================= Daten ================= */
const ORTE=[
 {id:'hof',n:'Hinterhof',d:'Wäscheleine, Gartenzaun, Nachbars Katze.',g:1500,wind:0,coin:1,need:0,sky:['#a8e0f2','#6fb6e8','#3a5fa8','#141a3d','#05060f'],ground:'#5cae4a'},
 {id:'strand',n:'Strand',d:'Möwen und Böen vom Meer.',g:1500,wind:55,coin:1.4,need:250,sky:['#ffd9a8','#f7a87a','#6c7fd1','#1d1f4f','#05060f'],ground:'#f2d38a'},
 {id:'stadt',n:'Großstadt',d:'Hochhäuser, Tauben, Flugzeuge.',g:1500,wind:30,coin:1.8,need:700,sky:['#c3d8e6','#8db3d6','#3f5f99','#141a3d','#05060f'],ground:'#8d8a86'},
 {id:'berg',n:'Gipfel',d:'Adler und starker Wind.',g:1500,wind:90,coin:2.4,need:1500,sky:['#bfe6ff','#7fbff0','#2e5aa8','#101640','#05060f'],ground:'#e9eef2'},
 {id:'mond',n:'Mond',d:'Wenig Schwerkraft, viele Meteoriten.',g:620,wind:0,coin:3.5,need:3000,sky:['#0b0d1f','#0b0d1f','#07081a','#05060f','#05060f'],ground:'#b9b4ac'},
];
const CH={
 kalle:{n:'Kalle',d:'Kann alles ein bisschen.',shirt:K.red,pants:K.blue,skin:'#f2c49b',hair:'#5a3a22',cost:0},
 erna:{n:'Oma Erna',d:'Federleicht: fliegt 10 % höher.',shirt:'#a782d8',pants:'#6b5a7a',skin:'#f1c9a8',hair:'#eeeeee',cost:600,g:.9,bun:1,glasses:1},
 bodo:{n:'Bodo',d:'Schwer: Vögel und Wind schubsen ihn kaum.',shirt:'#2d2d2d',pants:'#3a6e3a',skin:'#d9a07a',hair:'#1e1a2e',cost:1400,heavy:1,big:1},
 pepe:{n:'Clown Pepe',d:'Dreht sich 40 % schneller.',shirt:K.yellow,pants:'#3cb4e6',skin:'#fff1e0',hair:'#ff5a3c',cost:2500,spin:1.4,nose:1},
 kuni:{n:'Ritter Kuni',d:'Helm: Kopflandungen kosten keine Serie.',shirt:'#b7c0c9',pants:'#6d7782',skin:'#f2c49b',hair:'#b7c0c9',cost:4000,helmet:1},
 mira:{n:'Astronautin Mira',d:'Schwebt: 15 % weniger Schwerkraft.',shirt:'#f4f4f4',pants:'#e0e0e0',skin:'#c98a5e',hair:'#2a1a12',cost:8000,g:.85,astro:1},
};
const UP=[
 {id:'tuch',n:'Breiteres Tuch',d:'Mehr Platz zum Fangen',max:6,b:80,i:'↔'},
 {id:'feder',n:'Stärkere Federn',d:'Mehr Schwung bei gutem Timing',max:8,b:100,i:'≋'},
 {id:'gefuehl',n:'Taktgefühl',d:'Perfekt-Fenster wird größer',max:5,b:150,i:'◷'},
 {id:'start',n:'Starker Start',d:'Erster Wurf geht höher',max:5,b:70,i:'⇡'},
 {id:'magnet',n:'Münzmagnet',d:'Sammelt Münzen von weiter weg',max:5,b:90,i:'U'},
 {id:'spar',n:'Sparschwein',d:'+15 % Münzwert',max:6,b:120,i:'€'},
 {id:'polster',n:'Polster',d:'Kopflandungen bremsen weniger',max:4,b:110,i:'▤'},
 {id:'puste',n:'Kondition',d:'Die Träger halten länger durch',max:6,b:90,i:'♥'},
];
const upCost=(u,l)=>Math.round(u.b*(1+l)*(1+l*.5));
const MT={
 hoehe:{t:n=>`Erreiche ${n} m Höhe`,s:[30,60,100,160,250,400,600,900,1300,2000,3000,5000],run:1},
 salto:{t:n=>n===1?'Mach einen Salto und lande':`Lande einen ${n}fach-Salto`,s:[1,2,3,4,5,6,8,10],run:1},
 perfekt:{t:n=>`${n} perfekte Würfe in Folge`,s:[3,5,8,12,16,22,30],run:1},
 stand:{t:n=>`Lande ${n}× auf den Füßen in einer Runde`,s:[3,6,10,15,25,40],run:1},
 muenzen:{t:n=>`Sammle ${n} Münzen in einer Runde`,s:[15,40,80,150,300,600],run:1},
 punkte:{t:n=>`Hol ${fmt(n)} Punkte in einer Runde`,s:[300,800,2000,4000,8000,15000,30000,60000],run:1},
 vogel:{t:n=>`Rempel ${n} Vögel an`,s:[3,10,25,50,100]},
 wuerfe:{t:n=>`Fang den Springer ${n}× auf`,s:[20,60,150,400,1000]},
};

/* ================= Speicher ================= */
const KEY='hochwurf_v1';
const DEF={coins:0,bestH:0,bestS:0,placeBest:{},up:{},chars:['kalle'],char:'kalle',place:0,ms:null,ml:{},rank:1,sound:true,vib:true,day:'',streak:0,tut:0,st:{runs:0,throws:0,birds:0,flips:0}};
let S=null;try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){S=null}
S=Object.assign(JSON.parse(JSON.stringify(DEF)),S||{});S.st=Object.assign({},DEF.st,S.st||{});
if(!CH[S.char])S.char='kalle';if(!ORTE[S.place])S.place=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const upLv=id=>S.up[id]||0;

/* ---------- Aufgaben ---------- */
function goal(k){const s=MT[k].s,l=S.ml[k]||0;return l<s.length?s[l]:Math.round(s[s.length-1]*Math.pow(1.4,l-s.length+1))}
function newMis(ex){const ks=Object.keys(MT).filter(k=>!ex.includes(k));const k=ks[ri(0,ks.length-1)];return {k,g:goal(k),p:0,r:40+(S.ml[k]||0)*25}}
function ensureMis(){
  if(!Array.isArray(S.ms)||S.ms.length!==3||S.ms.some(m=>!m||!MT[m.k])){S.ms=[];for(let i=0;i<3;i++)S.ms.push(newMis(S.ms.map(m=>m.k)))}
  S.ms.forEach((m,i)=>{if(m.p>=m.g)S.ms[i]=newMis(S.ms.filter(x=>x!==m).map(x=>x.k))});save();
}
ensureMis();
function mis(k,v,runMax){
  S.ms.forEach(m=>{if(m.k!==k||m.p>=m.g)return;m.p=runMax?Math.max(m.p,v):m.p+v;
    if(m.p>=m.g){m.p=m.g;S.coins+=m.r;S.rank++;S.ml[k]=(S.ml[k]||0)+1;toast(`Aufgabe geschafft! <span class="coin">+${m.r}</span>`);sfx.mission();buzz([20,40,20])}});
}
function renderMis(){
  const h='<h3>AUFGABEN · RANG '+S.rank+'</h3>'+S.ms.map(m=>`<div class="mis${m.p>=m.g?' done':''}"><span class="t">${MT[m.k].t(m.g)}</span>
    <span class="r">${m.p>=m.g?'geschafft':fmt(m.p)+'/'+fmt(m.g)} · <span class="coin">${m.r}</span></span><div class="bar"><i style="width:${Math.min(100,m.p/m.g*100)}%"></i></div></div>`).join('');
  $('#mMis').innerHTML=h;$('#oMis').innerHTML=h;
}

/* ================= Ton ================= */
let AC=null,master=null;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.5;master.connect(AC.destination)}catch(e){AC=null}}
  if(AC&&AC.state==='suspended')AC.resume().catch(()=>{})}
const lastS={};
function tone(f,d,type,v,f2,delay,key,gap){
  if(!S.sound||!AC)return;
  if(key){const n=AC.currentTime;if(lastS[key]&&n-lastS[key]<gap)return;lastS[key]=n}

const SK=[['head',0,-76,11],['chest',0,-54,9],['pelvis',0,-26,9],['lElb',-14,-45,5],['lHand',-21,-32,5],['rElb',14,-45,5],['rHand',21,-32,5],
  ['lKnee',-6,-13,6],['lFoot',-8,0,6],['rKnee',6,-13,6],['rFoot',8,0,6]];
const BONES=[[0,1,1],[1,2,1],[1,3,1],[3,4,1],[1,5,1],[5,6,1],[2,7,1],[7,8,1],[2,9,1],[9,10,1],[0,2,.5],[3,5,.08],[7,9,.06],[1,7,.05],[1,9,.05]];
function makeRag(x,y,big){
  const s=big?1.12:1;
  const pts=SK.map(([n,dx,dy,r])=>({x:x+dx*s,y:y+dy*s,px:x+dx*s,py:y+dy*s,r:r*s}));
  const cons=BONES.map(([a,b,k])=>({a,b,k,l:Math.hypot(pts[a].x-pts[b].x,pts[a].y-pts[b].y)}));
  return {pts,cons,rest:SK.map(([n,dx,dy])=>[dx*s,dy*s])};
}
function com(R){let x=0,y=0;for(const p of R.pts){x+=p.x;y+=p.y}return [x/R.pts.length,y/R.pts.length]}
function comV(R,dt){let x=0,y=0;for(const p of R.pts){x+=p.x-p.px;y+=p.y-p.py}const n=R.pts.length;return [x/n/dt,y/n/dt]}
function angVel(R,dt){const [cx,cy]=com(R),[vx,vy]=comV(R,dt);let num=0,den=0;
  for(const p of R.pts){const rx=p.x-cx,ry=p.y-cy,ux=(p.x-p.px)/dt-vx,uy=(p.y-p.py)/dt-vy;num+=rx*uy-ry*ux;den+=rx*rx+ry*ry}return den?num/den:0}
function setMotion(R,vx,vy,w,dt){const [cx,cy]=com(R);for(const p of R.pts){const rx=p.x-cx,ry=p.y-cy;p.px=p.x-(vx-w*ry)*dt;p.py=p.y-(vy+w*rx)*dt}}
function addSpin(R,dw,dt){const [cx,cy]=com(R);for(const p of R.pts){const rx=p.x-cx,ry=p.y-cy;p.px-=(-dw*ry)*dt;p.py-=(dw*rx)*dt}}
function solve(R){
  for(let it=0;it<6;it++)for(const c of R.cons){const a=R.pts[c.a],b=R.pts[c.b],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1e-6;
    if(c.k<.2&&d>c.l*.75)continue; // weiche Bänder halten nur gegen Zusammenklappen
    const f=(d-c.l)/d*.5*c.k;a.x+=dx*f;a.y+=dy*f;b.x-=dx*f;b.y-=dy*f}
}
const torsoAng=R=>Math.atan2(R.pts[0].x-R.pts[2].x,-(R.pts[0].y-R.pts[2].y));

let G=null,scene='menu';
function newGame(demo){
  const pl=ORTE[S.place],ch=CH[S.char];
  G={demo,t:0,state:'ready',pl,ch,g:pl.g*(ch.g||1),tx:W/2,tw:112+upLv('tuch')*10,rag:makeRag(W/2,TY-3,ch.big),
    sag:0,sagX:W/2,contact:null,tapBuf:-9,score:0,combo:0,bestCombo:0,coins:0,coinV:pl.coin*(1+upLv('spar')*.15),maxH:0,
    peakY:TY,flightRot:0,lastAng:0,flips:0,bestFlip:0,stands:0,throws:0,birds:0,first:true,
    stam:100,tired:false,camY:0,shake:0,items:[],genY:TY-200,texts:[],parts:[],crashT:0,windT:rnd(0,9),lastSpinT:-9,face:'ok',wheeT:0,flash:0};
  G.camY=camGround();

}
const camGround=()=>-(H-46);
function windAcc(y){
  const pl=G.pl;if(!pl.wind||toM(y)<8)return 0;
  const f=Math.min(1,toM(y)/80),w=Math.sin(G.t*.35+G.windT)*.7+Math.sin(G.t*.9+G.windT*2)*.3;
  return pl.wind*w*f*(G.ch.heavy?.4:1);
}
function launch(v){
  const R=G.rag;G.state='fly';G.first=false;
  setMotion(R,rnd(-25,25),-v,rnd(-1.5,1.5),STEP);
  G.peakY=com(R)[1];G.flightRot=0;G.lastAng=torsoAng(R);sfx.boing(1);
}
/* Taps */
function tapDown(wx){
  if(!G||scene!=='play')return;
  if(G.state==='ready'){launch(820+upLv('start')*115);G.combo=0;return 'used'}
  if(G.state==='tuch'){if(G.contact.tap==null)G.contact.tap=G.contact.t;return 'used'}
  if(G.state==='fly'){const R=G.rag,[cx,cy]=com(R),[vx,vy]=comV(R,STEP);
    // kurz vor dem Aufprall: Tipp merken (zählt fürs Timing)
    let low=-1e9;for(const p of R.pts)low=Math.max(low,p.y+p.r);
    if(vy>0&&Math.abs(cx-G.tx)<G.tw/2+20&&(TY-low)/vy<.13&&(TY-low)>-4){G.tapBuf=G.t;return 'used'}}
  return null;
}
function tapSpin(wx){
  if(!G||G.state!=='fly')return;
  const R=G.rag,[cx]=com(R),cur=angVel(R,STEP),d=(wx<cx?-1:1)*7*(G.ch.spin||1);
  const nw=clamp(cur+d,-20*(G.ch.spin||1),20*(G.ch.spin||1));addSpin(R,nw-cur,STEP);G.lastSpinT=G.t;sfx.spin();
  for(let i=0;i<5;i++)G.parts.push({x:cx+rnd(-10,10),y:com(R)[1]+rnd(-10,10),vx:rnd(-80,80),vy:rnd(-80,80),life:.35,max:.35,c:K.paper,s:4,k:'puff'});
}
function contactStart(){
  const R=G.rag,[cx,cy]=com(R),[vx,vy]=comV(R,STEP);
  if(G.stam<=0){G.tired=true;pop('ZU MÜDE!',K.red,-1);return}
  let li=0,ly=-1e9;R.pts.forEach((p,i)=>{if(p.y+p.r>ly){ly=p.y+p.r;li=i}});
  const part=li===0?'head':(li===8||li===10)?'feet':(li===4||li===6)?'hands':'body';
  const D=clamp(16+vy*.022,16,64);
  G.contact={t:0,dur:.17,cx,cy,vIn:vy,vx,w:angVel(R,STEP),part,D,off:R.pts.map(p=>[p.x-cx,p.y-cy]),tap:G.t-G.tapBuf<.14?-(G.t-G.tapBuf):null};
  G.state='tuch';G.sagX=cx;G.throws++;S.st.throws++;mis('wuerfe',1);
  // Landung bewerten
  const h=Math.round(toM(G.peakY)),flips=Math.floor(Math.abs(G.flightRot)/TAU+.12);
  let pts=h,txt=[];
  if(part==='head'){txt.push(['KOPFÜBER!',K.red]);if(!G.ch.helmet)G.combo=0;G.face='ouch'}
  else{
    if(flips>=1){pts+=100*flips*flips;txt.push([flips===1?'SALTO!':flips===2?'DOPPELSALTO!':flips===3?'DREIFACHSALTO!':flips+'-FACH-SALTO!',K.yellow]);
      G.flips+=flips;S.st.flips+=flips;G.bestFlip=Math.max(G.bestFlip,flips);mis('salto',flips,true)}
    if(part==='feet'){pts*=2;txt.push(['GESTANDEN ×2',K.green]);G.stands++;mis('stand',G.stands,true)}
  }
  G.pendPts=pts;G.pendTxt=txt;
  G.face=part==='head'?'ouch':'ok';
  buzz(part==='head'?[30,30,30]:12);
}
function contactEnd(){
  const c=G.contact,R=G.rag;
  let q='none',err=9;
  if(c.tap!=null){err=Math.abs(c.tap-c.dur*.5);const pw=.05+upLv('gefuehl')*.007;q=err<=pw?'perfect':err<=pw*2?'good':'weak'}
  const e=c.part==='head'?.55+upLv('polster')*.07:c.part==='feet'?.93:.86;
  const B=330*(1+upLv('feder')*.1)*(1+Math.min(G.combo,25)*.05);
  const boost={perfect:B,good:B*.55,weak:B*.2,none:0}[q];
  let vOut=Math.max(280,c.vIn*e+boost);
  if(G.demo)vOut=Math.min(vOut,760);
  const off=(c.cx-G.tx)/(G.tw/2);
  const vx=clamp(c.vx*.35+off*170+rnd(-15,15),-320,320);
  const w=c.w*.35-off*3+rnd(-.6,.6);
  G.state='fly';setMotion(R,vx,-vOut,w,STEP);
  if(q==='perfect'){G.combo++;G.bestCombo=Math.max(G.bestCombo,G.combo);mis('perfekt',G.combo,true);sfx.perfect(G.combo);G.flash=.18;
    for(let i=0;i<18;i++){const a=rnd(Math.PI,TAU);G.parts.push({x:c.cx,y:TY,vx:Math.cos(a)*rnd(80,260),vy:Math.sin(a)*rnd(80,260),life:.6,max:.6,c:[K.yellow,K.red,K.blue,K.paper][i%4],s:5,k:'conf'})}}
  else if(q==='good'){G.combo=Math.max(0,G.combo);}
  else G.combo=0;
  G.stam-=({perfect:3,good:5,weak:7,none:8}[q]+(c.part==='head'?4:0))*(1-upLv('puste')*.08);
  if(G.stam<=25&&G.stam>0&&!G.warnedTired){G.warnedTired=1;pop('DIE TRÄGER SCHNAUFEN',K.orange,-1)}
  sfx.boing(q==='perfect'?2:q==='good'?1:0);
  const mult=1+Math.min(G.combo,20)*.1;
  const pts=Math.round((G.pendPts||0)*mult);
  if(G.pendPts!=null){G.score+=pts;mis('punkte',G.score,true);
    G.pendTxt.forEach(([t,c2],i)=>pop(t,c2,i));
    if(pts>0)pop('+'+fmt(pts),K.paper,G.pendTxt.length)}
  if(q!=='none')pop(q==='perfect'?(G.combo>1?'PERFEKT ×'+G.combo:'PERFEKT!'):q==='good'?'GUT':'ZU '+(c.tap<c.dur*.5?'FRÜH':'SPÄT'),q==='perfect'?K.yellow:q==='good'?K.teal:K.grey,-1);
  G.pendPts=null;G.contact=null;G.peakY=com(R)[1];G.flightRot=0;G.lastAng=torsoAng(R);G.tapBuf=-9;G.face='ok';
}
function crash(){
  G.state='crash';G.crashT=0;G.shake=12;G.face='ko';sfx.crash();buzz([60,40,120]);
  const [cx]=com(G.rag);for(let i=0;i<22;i++)G.parts.push({x:cx+rnd(-20,20),y:-4,vx:rnd(-160,160),vy:rnd(-160,-20),life:rnd(.5,.9),max:.9,c:'#d8c9a8',s:rnd(8,16),k:'dust'});
}
let popT=0;

/* ---------- Gegenstände in der Luft ---------- */
function genItems(){
  const pl=G.pl,top=G.camY-H*1.2;
  while(G.genY>top){
    const y=G.genY,m=toM(y);G.genY-=rnd(140,240);
    if(m>12&&Math.random()<.16)G.items.push({k:'brezel',x:rnd(40,W-40),y,r:16,ph:rnd(0,TAU)});
    if(Math.random()<.7){const n=ri(4,7),vert=Math.random()<.35,dx=vert?0:rnd(26,40)*(Math.random()<.5?-1:1),x0=vert?rnd(40,W-40):(dx>0?rnd(30,120):rnd(W-120,W-30));
      for(let i=0;i<n;i++)G.items.push({k:'coin',x:clamp(x0+(vert?0:i*dx),20,W-20),y:y-(vert?i*34:Math.sin(i/n*Math.PI)*30),got:false,ph:rnd(0,TAU)})}
    if(pl.id==='mond'){if(m>40&&Math.random()<.22)G.items.push({k:'meteor',x:Math.random()<.5?-30:W+30,y,vx:0,vy:0,r:16,dir:Math.random()<.5?1:-1})}
    else if(m>18&&Math.random()<Math.min(.5,.18+m/1500)){const dir=Math.random()<.5?1:-1;
      G.items.push({k:'bird',x:dir>0?-30:W+30,y,vx:dir*rnd(70,140)*(pl.id==='berg'?1.3:1),r:13,dir,ph:rnd(0,TAU),kind:pl.id==='strand'?'gull':pl.id==='berg'?'eagle':pl.id==='stadt'?'pigeon':'crow'})}
    if(m>35&&pl.id!=='mond'&&Math.random()<.12)G.items.push({k:'balloon',x:rnd(40,W-40),y,r:18,ph:rnd(0,TAU),c:[K.red,K.yellow,K.blue,K.pink][ri(0,3)]});
    if(m>(pl.id==='stadt'?250:700)&&pl.id!=='mond'&&Math.random()<.1){const dir=Math.random()<.5?1:-1;G.items.push({k:'plane',x:dir>0?-120:W+120,y,vx:dir*260,r:30,dir})}
  }
  const lim=G.camY+H+600;G.items=G.items.filter(i=>i.y<lim&&!i.dead);
}
function updItems(dt){
  const R=G.rag,[cx,cy]=com(R),mag=30+upLv('magnet')*14;
  for(const it of G.items){
    if(it.k==='bird'||it.k==='plane'){it.x+=it.vx*dt;if(it.k==='bird'){it.ph+=dt*12;if(it.x<-60)it.x=W+50;if(it.x>W+60)it.x=-50}}
    if(it.k==='meteor'){if(Math.abs(it.y-cy)<500&&!it.go){it.go=1;it.vx=it.dir*-1*rnd(150,220);it.vy=rnd(60,120)}if(it.go){it.x+=it.vx*dt;it.y+=it.vy*dt}}
    if(Math.abs(it.y-cy)>130||G.state!=='fly')continue;
    if(it.k==='coin'&&!it.got){
      for(const p of R.pts){if(Math.hypot(p.x-it.x,p.y-it.y)<mag+p.r){it.got=true;G.coins+=G.coinV;mis('muenzen',Math.floor(G.coins),true);sfx.coin();
        for(let i=0;i<5;i++)G.parts.push({x:it.x,y:it.y,vx:rnd(-90,90),vy:rnd(-90,90),life:.3,max:.3,c:K.yellow,s:4,k:'conf'});break}}
    }else if(it.k==='brezel'&&!it.dead){
      for(const p of R.pts){if(Math.hypot(p.x-it.x,p.y-it.y)<it.r+p.r+6){it.dead=true;G.stam=Math.min(100,G.stam+22);G.tired=false;sfx.buy();pop('BREZEL! +PUSTE',K.orange,-1);break}}
    }else if(!it.hit&&(it.k==='bird'||it.k==='plane'||it.k==='meteor'||it.k==='balloon')){
      for(const p of R.pts){if(Math.hypot(p.x-it.x,p.y-it.y)<it.r+p.r){
        it.hit=true;const [vx,vy]=comV(R,STEP),w=angVel(R,STEP);
        if(it.k==='balloon'){it.dead=true;setMotion(R,vx,Math.min(vy,0)-420,w,STEP);G.coins+=5*G.coinV;sfx.pop();pop('BALLON! +5',K.pink,-1);
          for(let i=0;i<12;i++)G.parts.push({x:it.x,y:it.y,vx:rnd(-150,150),vy:rnd(-150,150),life:.4,max:.4,c:it.c,s:6,k:'conf'})}
        else{const kb=(G.ch.heavy?.35:1)*(it.k==='plane'?2.2:it.k==='meteor'?1.6:1);
          setMotion(R,vx+(it.vx||it.dir*120)*1.6*kb,vy-60*kb,w+rnd(-6,6)*kb,STEP);
          if(it.k==='bird'){it.vx*=-1.5;it.dazed=1;G.birds++;S.st.birds++;mis('vogel',1);sfx.bird();pop(it.kind==='gull'?'MÖWE!':'VOGEL!',K.paper,-1);
            for(let i=0;i<8;i++)G.parts.push({x:it.x,y:it.y,vx:rnd(-120,120),vy:rnd(-120,40),life:1,max:1,c:K.paper,s:7,k:'feather',rot:rnd(0,TAU)})}
          else{sfx.crash();G.shake=8;pop(it.k==='plane'?'FLUGZEUG!':'METEOR!',K.red,-1)}}
        break}}
    }
  }
}

/* ---------- Haupt-Update ---------- */
const STEP=1/120;
function update(dt){
  G.t+=dt;const R=G.rag;
  if(G.flash>0)G.flash-=dt;if(G.shake>0)G.shake=Math.max(0,G.shake-dt*40);
  // Tuch-Träger folgen
  G.tx=clamp(G.tx,G.tw/2+18,W-G.tw/2-18);
  if(G.demo&&G.state==='fly'){const px=predictX();if(px!=null)G.tx+=clamp(px-G.tx,-300*dt,300*dt)}
  if(G.state==='ready'){
    const sw=Math.sin(G.t*3)*1.5;R.pts.forEach((p,i)=>{const r=R.rest[i];p.x=p.px=G.tx+r[0]+(i===0?sw:0);p.y=p.py=TY-3+r[1]});
    if(G.demo&&G.t>.6)launch(700);
  }else if(G.state==='tuch'){
    const c=G.contact;c.t+=dt;const f=Math.min(1,c.t/c.dur),s=Math.sin(Math.PI*f)*c.D;
    G.sag=s;G.sagX=c.cx;c.cx+=clamp(G.tx-c.cx,-1,1)*0; // bleibt liegen
    R.pts.forEach((p,i)=>{p.x=p.px=c.cx+c.off[i][0];p.y=p.py=c.cy+c.off[i][1]+s});
    if(G.demo&&c.tap==null&&c.t>=c.dur*.5-.01)c.tap=c.t;
    if(c.t>=c.dur)contactEnd();
  }else{
    G.sag=Math.max(0,G.sag-dt*300);
    const g=G.g,[cx0,cy0]=com(R),wa=windAcc(cy0);
    for(const p of R.pts){const vx=(p.x-p.px)*.9993,vy=(p.y-p.py)*.9993;p.px=p.x;p.py=p.y;p.x+=vx+wa*dt*dt;p.y+=vy+g*dt*dt}
    solve(R);
    for(const p of R.pts){
      if(p.x<p.r){const v=p.x-p.px;p.x=p.r;p.px=p.x+v*.5}
      if(p.x>W-p.r){const v=p.x-p.px;p.x=W-p.r;p.px=p.x+v*.5}
      if(p.y>-p.r){const vx=p.x-p.px,vy=p.y-p.py;p.y=-p.r;p.py=p.y+vy*.3;p.px=p.x-vx*.6}
    }
    if(G.state==='fly'){
      const [cx,cy]=com(R),[vx,vy]=comV(R,STEP);
      if(cy<G.peakY)G.peakY=cy;
      const a=torsoAng(R);let da=a-G.lastAng;if(da>Math.PI)da-=TAU;if(da<-Math.PI)da+=TAU;G.flightRot+=da;G.lastAng=a;
      G.maxH=Math.max(G.maxH,toM(cy));
      if(vy<-900&&G.t-G.wheeT>2){G.wheeT=G.t;if(toM(cy)>30)sfx.whee()}
      G.face=vy<-700?'whee':vy>900?'scared':G.face==='ouch'?'ouch':'ok';
      let low=-1e9;for(const p of R.pts)low=Math.max(low,p.y+p.r);
      if(vy>0&&!G.tired&&low>=TY&&low-vy*STEP<=TY+2&&Math.abs(cx-G.tx)<=G.tw/2+8)contactStart();

    const [cx,cy]=com(G.rag);ctx.font=`16px ${DISP}`;ctx.textAlign='center';ctx.fillStyle=K.paper;ctx.fillText(Math.round(toM(cy))+' m',VW/2,by+50);
  }
  // Höhe groß, solange geflogen wird
  if(scene==='play'&&G.state!=='ready'){const [cx,cy]=com(G.rag),m=Math.round(toM(cy));if(m>=5){ctx.font=`${Math.round(30*Math.min(1.3,SC))}px ${DISP}`;ctx.textAlign='left';ctx.textBaseline='alphabetic';
    const tx=14+OX,ty=VH*.25;ctx.lineWidth=6;ctx.strokeStyle=K.ink;ctx.lineJoin='round';ctx.strokeText(m+' m',tx,ty);ctx.fillStyle=K.paper;ctx.fillText(m+' m',tx,ty)}}
  // Popup-Texte
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const t of G.texts){const f=t.life/t.max,y=VH*(t.slot<0?.6:.66)+(t.slot<0?0:t.slot*32)-(1-f)*30;ctx.globalAlpha=Math.min(1,f*3);
    const sz=Math.round((t.slot<0?30:24)*Math.min(1.3,SC)*(1+Math.max(0,f-.85)*2));ctx.font=`${sz}px ${DISP}`;ctx.lineWidth=7;ctx.strokeStyle=K.ink;ctx.strokeText(t.t,VW/2,y);ctx.fillStyle=t.c;ctx.fillText(t.t,VW/2,y)}
  ctx.globalAlpha=1;
  if(scene==='play'&&G.state==='ready'){const a=.6+.4*Math.sin(G.t*5);ctx.globalAlpha=a;ctx.font=`${Math.round(24*Math.min(1.3,SC))}px ${DISP}`;ctx.lineWidth=6;ctx.strokeStyle=K.ink;
    ctx.strokeText('TIPPEN ZUM WERFEN',VW/2,VH*.38);ctx.fillStyle=K.paper;ctx.fillText('TIPPEN ZUM WERFEN',VW/2,VH*.38);
    if(S.tut<2){ctx.font=`800 15px ${BODY}`;const l=['Wischen: Tuch verschieben','Tippen beim Aufprall: mehr Schwung','Tippen in der Luft: Salto'];
      l.forEach((s2,i)=>{ctx.lineWidth=4;ctx.strokeText(s2,VW/2,VH*.38+36+i*22);ctx.fillText(s2,VW/2,VH*.38+36+i*22)})}
    ctx.globalAlpha=1}
}

/* ================= Eingabe ================= */
let ptr=null;
const toWX=cx=>(cx-OX)/SC;
cv.addEventListener('pointerdown',e=>{audio();e.preventDefault();if(scene!=='play'||!G)return;
  const used=tapDown(toWX(e.clientX));ptr={id:e.pointerId,x:e.clientX,sx:e.clientX,t:performance.now(),moved:0,used};try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{if(!ptr||e.pointerId!==ptr.id||!G)return;const dx=e.clientX-ptr.x;ptr.x=e.clientX;ptr.moved+=Math.abs(dx);
  if(G.state!=='crash')G.tx+=dx/SC*1.25});
cv.addEventListener('pointerup',e=>{if(!ptr||e.pointerId!==ptr.id)return;
  if(!ptr.used&&ptr.moved<12&&performance.now()-ptr.t<300)tapSpin(toWX(e.clientX));ptr=null});
cv.addEventListener('pointercancel',()=>{ptr=null});
const keys={};
window.addEventListener('keydown',e=>{if(keys[e.code])return;keys[e.code]=true;if(scene!=='play'||!G)return;
  if(e.code==='Space'){e.preventDefault();audio();if(!tapDown(G.tx))tapSpin(com(G.rag)[0]+(Math.random()<.5?-1:1))}if(e.code==='Escape')pause()});
window.addEventListener('keyup',e=>{keys[e.code]=false});
function keySteer(dt){if(!G)return;const s=520*dt;if(keys.ArrowLeft||keys.KeyA)G.tx-=s;if(keys.ArrowRight||keys.KeyD)G.tx+=s}

/* ================= Oberfläche ================= */
const LAYERS=['menu','shop','chars','places','pause','over'];
function show(id){LAYERS.forEach(l=>$('#'+l).classList.toggle('hide',l!==id))}
let toastT=0;function toast(h){const e=$('#toast');e.innerHTML=h;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),2600)}
function coinsAll(){['#mCoins','#shCoins','#chCoins','#plCoins'].forEach(s=>$(s).textContent=fmt(S.coins))}
function goMenu(){scene='menu';document.body.classList.remove('playing');newGame(true);show('menu');$('#hud').classList.add('hide');
  $('#mBestH').textContent=Math.round(S.bestH)+' m';$('#mBestS').textContent=fmt(S.bestS);coinsAll();renderMis()}
function startGame(){audio();scene='play';document.body.classList.add('playing');newGame(false);show(null);$('#hud').classList.remove('hide');updHud(true);last=performance.now();acc=0}
function pause(){if(scene!=='play'||!G||G.state==='crash')return;scene='pause';show('pause')}
function showOver(){
  scene='over';const pl=S.place;
  const earned=Math.floor(G.coins+G.maxH/2+G.score/200);S.coins+=earned;S.st.runs++;
  const recH=G.maxH>(S.placeBest[pl]||0)+.5,recS=G.score>S.bestS;
  S.placeBest[pl]=Math.max(S.placeBest[pl]||0,G.maxH);S.bestH=Math.max(S.bestH,G.maxH);S.bestS=Math.max(S.bestS,G.score);
  mis('hoehe',Math.round(G.maxH),true);if(S.tut<2)S.tut++;
  const newPl=ORTE.filter((o,i)=>o.need>0&&S.bestH>=o.need&&!S['seenPl'+i]);newPl.forEach(o=>{S['seenPl'+ORTE.indexOf(o)]=1;setTimeout(()=>toast(`Neuer Ort: ${o.n}!`),900)});
  save();
  $('#oScore').textContent=fmt(G.score);$('#oH').textContent=Math.round(G.maxH)+' m';$('#oFlips').textContent=G.flips;$('#oCoins').textContent='+'+fmt(earned);
  $('#oRec').classList.toggle('hide',!(recH&&G.maxH>10)&&!(recS&&G.score>0));$('#oRec').textContent=recH&&G.maxH>10?'HÖHENREKORD!':'NEUER REKORD!';
  if((recH&&G.maxH>10)||(recS&&G.score>0))sfx.rec();
  document.body.classList.remove('playing');renderMis();coinsAll();show('over');$('#hud').classList.add('hide');
  // erledigte Aufgaben gegen neue tauschen
  setTimeout(()=>{ensureMis();renderMis()},1200);
}
let lastHud='';
function updHud(force){if(!G)return;const s=fmt(G.score)+'|'+G.combo+'|'+Math.floor(G.coins)+'|'+Math.round(G.stam);if(s===lastHud&&!force)return;lastHud=s;
  const st=$('#hStam');st.style.width=Math.max(0,G.stam)+'%';st.style.background=G.stam>50?'var(--green)':G.stam>25?'var(--yellow)':'var(--red)';
  $('#hScore').textContent=fmt(G.score);$('#hCombo').textContent=G.combo>1?'SERIE ×'+G.combo:'';$('#hCoins').textContent=fmt(G.coins)}
function renderShop(){coinsAll();$('#shopList').innerHTML=UP.map(u=>{const l=upLv(u.id),c=upCost(u,l),mx=l>=u.max;
  return `<div class="card item"><span class="ico">${u.i}</span><div><div class="n">${u.n}</div><div class="d">${u.d}</div><div class="pips">${Array.from({length:u.max},(_,i)=>`<i class="${i<l?'on':''}"></i>`).join('')}</div></div>
  ${mx?'<span class="tagx">MAX</span>':`<button class="buy" data-up="${u.id}"${S.coins<c?' disabled':''}><span class="coin">${fmt(c)}</span></button>`}</div>`}).join('')}
$('#shopList').addEventListener('click',e=>{const b=e.target.closest('[data-up]');if(!b)return;const u=UP.find(x=>x.id===b.dataset.up),l=upLv(u.id),c=upCost(u,l);
  if(l>=u.max||S.coins<c)return;S.coins-=c;S.up[u.id]=l+1;save();sfx.buy();buzz(20);renderShop()});
function renderChars(){coinsAll();$('#charList').innerHTML=Object.keys(CH).map(id=>{const c=CH[id],own=S.chars.includes(id),sel=S.char===id;
  const btn=sel?'<span class="tagx">AKTIV</span>':own?`<button class="buy" data-pick="${id}">Wählen</button>`:`<button class="buy" data-buy="${id}"${S.coins<c.cost?' disabled':''}><span class="coin">${fmt(c.cost)}</span></button>`;
  return `<div class="card item${sel?' sel':''}"><canvas class="ico" width="92" height="92" data-face="${id}" style="background:${c.shirt}"></canvas><div><div class="n">${c.n}</div><div class="d">${c.d}</div></div>${btn}</div>`}).join('');
  document.querySelectorAll('[data-face]').forEach(cnv=>{const c2=cnv.getContext('2d');c2.scale(2,2);c2.translate(20,24);drawHead(c2,CH[cnv.dataset.face])})}
function drawHead(c2,ch){const r=13;c2.lineWidth=3;c2.strokeStyle=K.ink;
  if(ch.astro){c2.beginPath();c2.arc(0,0,r+5,0,TAU);c2.fillStyle='rgba(220,240,255,.9)';c2.fill();c2.stroke()}
  c2.beginPath();c2.arc(0,0,r,0,TAU);c2.fillStyle=ch.skin;c2.fill();c2.stroke();c2.fillStyle=ch.hair;
  if(ch.helmet){c2.beginPath();c2.arc(0,0,r+1,Math.PI,TAU);c2.lineTo(r+1,2);c2.lineTo(-r-1,2);c2.closePath();c2.fill();c2.stroke();c2.fillStyle=K.ink;c2.fillRect(-r+3,-3,2*r-6,3)}
  else if(!ch.astro){c2.beginPath();c2.arc(0,-2,r,Math.PI*1.05,TAU*.97);c2.fill();if(ch.bun){c2.beginPath();c2.arc(0,-r-4,6,0,TAU);c2.fill();c2.stroke()}}
  c2.fillStyle=K.ink;c2.beginPath();c2.arc(-5,2,1.8,0,TAU);c2.arc(5,2,1.8,0,TAU);c2.fill();c2.lineWidth=2;c2.beginPath();c2.arc(0,6,4,.2,Math.PI-.2);c2.stroke();
  if(ch.glasses){c2.lineWidth=1.5;c2.beginPath();c2.arc(-5,2,4,0,TAU);c2.moveTo(9,2);c2.arc(5,2,4,0,TAU);c2.stroke()}
  if(ch.nose){c2.beginPath();c2.arc(0,5,3.5,0,TAU);c2.fillStyle=K.red;c2.fill();c2.lineWidth=1.5;c2.stroke()}}
$('#charList').addEventListener('click',e=>{const b=e.target.closest('.buy');if(!b)return;
  if(b.dataset.pick){S.char=b.dataset.pick;sfx.click()}else if(b.dataset.buy){const c=CH[b.dataset.buy];if(S.coins<c.cost)return;S.coins-=c.cost;S.chars.push(b.dataset.buy);S.char=b.dataset.buy;sfx.buy()}
  save();renderChars()});
function renderPlaces(){coinsAll();$('#placeList').innerHTML=ORTE.map((o,i)=>{const open=S.bestH>=o.need,sel=S.place===i;
  const btn=sel?'<span class="tagx">HIER</span>':open?`<button class="buy" data-pl="${i}">Hinfahren</button>`:`<span class="tagx grey">ab ${fmt(o.need)} m</span>`;
  return `<div class="card item${sel?' sel':''}"><span class="ico" style="background:${o.sky[0]}"><span style="display:block;width:100%;height:14px;margin-top:auto;background:${o.ground};border-top:3px solid #1e1a2e;border-radius:0 0 8px 8px"></span></span>
  <div><div class="n">${o.n}</div><div class="d">${o.d} Münzen ×${o.coin}<br>Rekord: ${Math.round(S.placeBest[i]||0)} m</div></div>${btn}</div>`}).join('')}
$('#placeList').addEventListener('click',e=>{const b=e.target.closest('[data-pl]');if(!b)return;S.place=+b.dataset.pl;save();sfx.click();renderPlaces();newGame(true)});
function bind(id,fn){$(id).addEventListener('click',e=>{audio();sfx.click();fn(e)})}
bind('#playBtn',startGame);bind('#oAgain',startGame);bind('#oMenu',goMenu);
bind('#pauseBtn',pause);bind('#resumeBtn',()=>{scene='play';show(null);last=performance.now()});bind('#quitBtn',()=>{scene='play';show(null);G.state='crash';G.crashT=1.4;G.face='ko'});
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{audio();sfx.click();const g=t.dataset.go;
  if(g==='shop')renderShop();if(g==='chars')renderChars();if(g==='places')renderPlaces();show(g)}));
document.querySelectorAll('[data-back]').forEach(b=>b.addEventListener('click',()=>{sfx.click();goMenu()}));
function syncT(){$('#sndBtn').classList.toggle('off',!S.sound);$('#vibBtn').classList.toggle('off',!S.vib)}
bind('#sndBtn',()=>{S.sound=!S.sound;save();syncT()});bind('#vibBtn',()=>{S.vib=!S.vib;save();syncT();buzz(30)});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
document.addEventListener('contextmenu',e=>e.preventDefault());
function dayStr(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function daily(){const n=new Date(),t=dayStr(n);if(S.day===t)return;const y=new Date(n);y.setDate(y.getDate()-1);S.streak=S.day===dayStr(y)?S.streak+1:1;S.day=t;
  const g=30*Math.min(S.streak,7);S.coins+=g;save();coinsAll();setTimeout(()=>toast(`Tag ${S.streak} in Folge: <span class="coin">+${g}</span>`),800)}

/* ================= Schleife ================= */
let last=performance.now(),acc=0;
function frame(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(G&&(scene==='play'||scene==='menu'||scene==='over')&&!(scene==='over'&&G.state!=='crash')){
    if(scene==='play')keySteer(dt);
    acc+=dt;let n=0;while(acc>=STEP&&n<12){update(STEP);acc-=STEP;n++}if(n>=12)acc=0;
    if(scene==='menu'&&G.state==='crash'&&G.crashT>1)newGame(true);
  }
  if(scene==='play')updHud();
  try{draw()}catch(e){console.error(e)}
  requestAnimationFrame(frame);
}
resize();syncT();goMenu();daily();requestAnimationFrame(frame);
window.__hw={get G(){return G},get S(){return S},update,startGame,goMenu,tapDown,tapSpin,predictX,com:()=>com(G.rag),comV:()=>comV(G.rag,STEP),get scene(){return scene},STEP,TY,W,ORTE,save};
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
<!--GAME-END-->
</body>
